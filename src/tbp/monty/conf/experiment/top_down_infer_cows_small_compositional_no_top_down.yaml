# @package _global_

defaults:
  - /monty: evidencegraph_exp1000_e3_t3
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: evidence_3lm_heterarchy
  - /monty/sensor_module: 3sm_2d3d_dist
  - /monty/connectivity: 3lm_3sm_heterarchy
  - /monty/attention_system: default
  - /environment: mujoco_dist_agent_sensors3
  - /env_interface: eval_cows_small_predefined
  - /env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch0
  - /env_interface/transform: gaussianblur_missing_depthto3d_sensor4
  - /termination: named_lm0_lm1_lm2_objectrecognition_t1000_e500_tot6000
  - /logging: detailed_info_evidence_eval_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    n_train_epochs: 3
    n_eval_epochs: ${constants.rotations_all_count}
    # Parent with `location_rel_model`, trained on the v7 2D children.
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}/my_trained_models/supervised_pre_training_cows_small_compositional_salience/pretrained/}
    seed: 42
    supervised_lm_ids: []
    python_log_level: INFO
    environment:
      env_init_args:
        data_path: ${path.expanduser:${oc.env:MONTY_DATA}/compositional_objects_1.4_mujoco}
    eval_env_interface_args:
      # The objects the parent above was trained on.
      object_names:
        - 002_cube_tbp
        - 004_cube_numenta
        - 012_cylinder_tbp_horz
        - 014_cylinder_numenta_horz
    logging:
      run_name: top_down_infer_cows_small_compositional_no_top_down
    monty_config:
      learning_modules:
        # The output gates the parent was trained with.
        learning_module_0:
          output_max_model_distance: 0.01
        learning_module_1:
          max_match_distance: 0.0025
          output_max_model_distance: 0.01
          output_min_evidence: 20.0
        learning_module_2:
          output_max_model_distance: 0.01
