# @package _global_

defaults:
  - /monty: evidencegraph_exp1000_e3_t3
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: evidence_3lm_heterarchy
  - /monty/sensor_module: 3sm_2d3d_dist_slic
  - /monty/connectivity: 3lm_3sm_heterarchy
  - /monty/attention_system: default_5mm
  - /environment: habitat_dist_agent_sensors3_256
  - /env_interface: train_cows_small_cube_faces_predefined
  - /env_interface/positioning_procedures_train: getgoodview_viewfinder_patch0
  - /env_interface/transform: gaussianblur_missing_depthto3d_sensor4_256
  - /termination: any3_min_e0_montyisdone_tot6000
  - /logging: silent_info_train

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    n_train_epochs: ${constants.rotations_cube_faces_count}
    n_eval_epochs: 3
    model_name_or_path: ${constants.compositional_pretrained_dir}/supervised_pre_training_cows_small_2d_children/pretrained/
    seed: 42
    supervised_lm_ids:
      - learning_module_2
    environment:
      env_init_args:
        data_path: ${path.expanduser:${oc.env:MONTY_DATA}/compositional_objects_1.4}
    logging:
      run_name: supervised_pre_training_cows_small_compositional_salience
    monty_config:
      learning_modules:
        learning_module_0:
          output_max_model_distance: 0.01
          region_proposers:
            - _target_: tbp.monty.frameworks.models.evidence_matching.region_proposal.excite_goal_locations.ExciteGoalLocations
          gsg:
            # Hypothesis-testing jumps only now and then, so the sensor
            # mostly saccades within the fixated object.
            min_post_goal_success_steps: 100
        learning_module_1:
          # 1 mm is the sticker LM's voxel size (max_graph_size 0.1 over 100
          # voxels); allow 2.5 mm so stickers still match.
          max_match_distance: 0.0025
          output_max_model_distance: 0.01
          # Only report the sticker once its evidence is well clear of the
          # confusable regime.
          output_min_evidence: 20.0
          gsg: null
        learning_module_2:
          output_max_model_distance: 0.01
          gsg: null
